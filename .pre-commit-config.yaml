repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        # Design Word doc in docs/design/ is ~1.1 MB; keep a margin above that.
        args: ["--maxkb=2048"]
      - id: detect-private-key
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.7
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: backlog-validate
        name: validate backlog/tasks.yaml
        entry: uv run python -m callscope.devtools.backlog validate
        language: system
        files: ^backlog/tasks\.yaml$
        pass_filenames: false
