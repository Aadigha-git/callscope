name: Implementation task
description: A unit of work from backlog/tasks.yaml
labels: ["type:feature"]
body:
  - type: input
    id: task_id
    attributes: { label: Task ID, placeholder: T-M1-03 }
    validations: { required: true }
  - type: input
    id: requirements
    attributes: { label: Requirement IDs, placeholder: FR-03, NFR-01 }
    validations: { required: true }
  - type: textarea
    id: description
    attributes: { label: Description }
    validations: { required: true }
  - type: textarea
    id: approach
    attributes: { label: Technical approach }
    validations: { required: true }
  - type: input
    id: dependencies
    attributes: { label: Dependencies (task IDs) }
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      value: "- [ ] \n- [ ] "
    validations: { required: true }
  - type: input
    id: estimate
    attributes: { label: Estimate (hours) }
    validations: { required: true }
