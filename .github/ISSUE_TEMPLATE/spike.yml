name: Spike
description: Time-boxed investigation
labels: ["type:spike"]
body:
  - type: input
    id: question
    attributes: { label: Question to answer }
    validations: { required: true }
  - type: input
    id: timebox
    attributes: { label: Time-box (hours) }
    validations: { required: true }
  - type: textarea
    id: exit
    attributes: { label: Exit criterion and fallback }
    validations: { required: true }
