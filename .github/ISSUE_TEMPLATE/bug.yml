name: Bug
description: Something is broken
labels: ["type:bug"]
body:
  - type: textarea
    id: what
    attributes: { label: What happened, description: Include call_id / eval run_id if available }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: Expected behaviour }
    validations: { required: true }
  - type: textarea
    id: repro
    attributes: { label: Steps to reproduce }
  - type: input
    id: rc
    attributes: { label: Suspected root-cause code, placeholder: RC-ASR-ENT }
