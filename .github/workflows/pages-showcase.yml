# Optional GitHub Pages for docs/showcase (T-M6-03)
name: pages-showcase
on:
  push:
    branches: [main]
    paths:
      - "docs/showcase/**"
      - "docs/runbooks/**"
      - "docs/reports/**"
      - "docs/experiments/**"
      - "docs/model_cards/**"
      - ".github/workflows/pages-showcase.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage docs tree for Pages
        run: |
          mkdir -p _site
          cp -R docs/* _site/
          # Entry at /showcase/
          echo '<!DOCTYPE html><meta http-equiv="refresh" content="0;url=showcase/">' > _site/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
