name: Deploy (manual)
# Deploys to the staging (gpu-dev) or demo node. Requires GitHub Environments named
# "staging" and "demo" with secrets DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY. Demo should require
# a manual approval in the environment protection rules.
on:
  workflow_dispatch:
    inputs:
      target:
        description: Environment to deploy
        type: choice
        options: [staging, demo]
        required: true
      ref:
        description: Tag or branch to deploy
        default: main
        required: true
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ inputs.ref }}" }
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: ./scripts/deploy.sh "${{ inputs.target }}" "$DEPLOY_USER@$DEPLOY_HOST"
