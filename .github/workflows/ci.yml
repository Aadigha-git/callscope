name: CI
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with: { python-version: "3.11", enable-cache: true }
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with: { python-version: "3.11", enable-cache: true }
      - run: uv sync --extra dev
      - run: uv run mypy

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: callscope
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: callscope_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U callscope -d callscope_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      CALLSCOPE_ENV: test
      CALLSCOPE_TEST_DATABASE_URL: postgresql://callscope:ci_only_password@localhost:5432/callscope_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with: { python-version: "3.11", enable-cache: true }
      - run: uv sync --extra dev
      - run: uv run pytest -m "unit or contract or integration or security" --junitxml=junit.xml
      - name: Validate Compose / Prometheus / Grafana demo wiring
        run: uv run pytest tests/infra/test_compose_config.py -q --no-cov
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: junit.xml

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: astral-sh/setup-uv@v7
        with: { python-version: "3.11" }
      - run: uv sync --extra dev
      # Audit locked third-party deps. Do not combine --strict with --skip-editable:
      # pip-audit treats skipped editables as fatal under --strict (verified in
      # pip_audit._cli for the installed version). Export omits the local project
      # and the path-editable hermes-callscope plugin (no PyPI hashes).
      - name: Audit locked dependencies
        run: |
          uv export --frozen --no-emit-project --no-emit-package hermes-callscope \
            --extra dev -o /tmp/requirements-audit.txt
          uv run pip-audit -r /tmp/requirements-audit.txt --strict --disable-pip

  artifacts-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: astral-sh/setup-uv@v7
        with: { python-version: "3.11" }
      - run: uv sync --extra dev
      - run: uv run python -m callscope.devtools.backlog validate
      - name: Backlog view is up to date
        run: |
          uv run python -m callscope.devtools.backlog render
          git diff --exit-code docs/BACKLOG.md || (echo "Run 'make backlog-render' and commit docs/BACKLOG.md" && exit 1)
      - name: PR artifact gate (changelog, backlog, API and schema docs)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: uv run python -m callscope.devtools.check_artifacts origin/${{ github.base_ref }}

  build:
    needs: [lint, typecheck, test, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with: { python-version: "3.11" }
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
