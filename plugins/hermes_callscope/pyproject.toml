[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-callscope"
version = "0.1.0"
description = "CallScope receptionist tools plugin for Hermes Agent"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
]

[project.entry-points."hermes_agent.plugins"]
callscope = "hermes_callscope:register"

[tool.setuptools.packages.find]
where = ["src"]
