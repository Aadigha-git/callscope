[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "callscope"
version = "0.5.0"
description = "Self-hosted Hermes-backed voice agent with a telephony-realistic eval, call-review and governance harness"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "prometheus-client>=0.20",
  "pyyaml>=6.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "alembic>=1.14",
  "psycopg[binary]>=3.1",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "websockets>=13",
  "livekit-api>=1.0",
  "hermes-callscope",
  "jiwer>=4.0.0",
  "numpy>=2.4.6",
  "scipy>=1.17.1",
  "jinja2>=3.1",
]

[tool.uv.sources]
hermes-callscope = { path = "plugins/hermes_callscope", editable = true }

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML",
  "pre-commit>=3.7",
  "pip-audit>=2.7",
  "pglast>=6.2",
  "openapi-spec-validator>=0.7",
  "psycopg[binary]>=3.1",
  "sqlalchemy[asyncio]>=2.0.36",
  "honcho>=2.0",
]
worker = [
  "livekit-agents[silero]==1.8.2",
  "livekit==1.1.18",
  "numpy>=2.0",
]
review = [
    "altair>=6.3.0",
    "streamlit>=1.64.0",
]
tracing = [
    "langsmith>=0.14.0",
]
governance = [
    "jinja2>=3.1",
    "mlflow>=3.16.1",
    "python-docx>=1.1",
]

[tool.setuptools.packages.find]
include = ["callscope*", "servers*", "apps*"]

[tool.setuptools.package-data]
callscope = ["governance/templates/*.j2"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["docs", "prompts", "spikes", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "PT", "RUF", "S", "T20"]
ignore = ["S603", "S607"]  # subprocess use is limited to devtools calling git/gh

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PT018"]
"callscope/devtools/**" = ["T201"]  # CLI tools print to the terminal
"apps/review/app.py" = ["T20", "BLE001", "E501"]
"apps/biz/seed.py" = ["T201"]
"apps/biz/store.py" = ["S311", "E501"]  # deterministic seed RNG; long FAQ strings
"apps/biz/routes.py" = ["B008"]  # FastAPI Query defaults
"plugins/hermes_callscope/**" = ["S110", "SIM105", "E501"]
"infra/hermes/toolset_selftest.py" = ["T201"]
"callscope/db/models.py" = ["RUF012"]  # SQLAlchemy __table_args__ dicts

[tool.mypy]
python_version = "3.12"
strict = true
files = ["callscope", "servers", "apps"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
  "mlx_whisper",
  "mlx_whisper.*",
  "numpy",
  "numpy.*",
  "scipy",
  "scipy.*",
  "piper",
  "piper.*",
  "kokoro_onnx",
  "kokoro_onnx.*",
  "livekit",
  "livekit.*",
  "streamlit",
  "streamlit.*",
  "altair",
  "altair.*",
  "pandas",
  "pandas.*",
  "langsmith",
  "langsmith.*",
  "mlflow",
  "mlflow.*",
  "jinja2",
  "jinja2.*",
  "docx",
  "docx.*",
]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --cov=callscope --cov-report=term-missing --cov-fail-under=70"
markers = [
  "unit: pure unit tests, no I/O",
  "contract: validates API/schema contracts",
  "integration: needs services (Postgres etc.)",
  "gpu: needs Apple Silicon / real model weights",
]

[tool.coverage.run]
omit = ["callscope/devtools/__main__.py"]
