[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "callscope"
version = "0.0.1"
description = "Self-hosted Hermes-backed voice agent with a telephony-realistic eval, call-review and governance harness"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "prometheus-client>=0.20",
  "pyyaml>=6.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "alembic>=1.14",
  "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML",
  "pre-commit>=3.7",
  "pip-audit>=2.7",
  "pglast>=6.2",
  "openapi-spec-validator>=0.7",
  "psycopg[binary]>=3.1",
  "sqlalchemy[asyncio]>=2.0.36",
]

[tool.setuptools.packages.find]
include = ["callscope*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["docs", "prompts", "spikes"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "PT", "RUF", "S", "T20"]
ignore = ["S603", "S607"]  # subprocess use is limited to devtools calling git/gh

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PT018"]
"callscope/devtools/**" = ["T201"]  # CLI tools print to the terminal
"callscope/db/models.py" = ["RUF012"]  # SQLAlchemy __table_args__ dicts

[tool.mypy]
python_version = "3.11"
strict = true
files = ["callscope"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --cov=callscope --cov-report=term-missing --cov-fail-under=70"
markers = [
  "unit: pure unit tests, no I/O",
  "contract: validates API/schema contracts",
  "integration: needs services (Postgres etc.)",
  "gpu: needs the GPU node / real models",
]

[tool.coverage.run]
omit = ["callscope/devtools/__main__.py"]
