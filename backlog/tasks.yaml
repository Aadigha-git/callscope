# Source of truth for tasks, sprints and status. Edit via `make status` / `make sprint` where possible.
# Fields: id, title, milestone, type, requirements, description, technical_approach, dependencies,
#         acceptance_criteria, owner, estimate_h, priority, status, sprint, issue, prompt
# status: backlog | ready | in_progress | in_review | done | blocked | dropped
# Scope (2026-09): local demo on Apple Silicon Mac; LLM via Nebius Token Factory; no public GPU VM demo.
tasks:
- id: T-M0-01
  title: Engineering environment and repository bootstrap
  milestone: M0
  type: chore
  requirements:
  - NFR-05
  - NFR-12
  description: "Create/finish the GitHub repo bootstrap: branch protection, CI, secrets handling, labels/milestones/issues,\
    \ Project board, logging + metrics baseline. No staging/demo Environments or deploy workflow."
  technical_approach: "Follow docs/DEV_GUIDE.md section 2; run scripts/setup_github.sh (no environment\
    \ creation); verify green CI on a trivial PR."
  dependencies: []
  acceptance_criteria:
  - main is protected; PRs require green CI (lint, typecheck, test, security, artifacts-gate)
  - make setup && make ci passes on a clean clone
  - All backlog tasks exist as GitHub issues linked to milestones M0-M6
  - Secret scanning + push protection enabled; .env is git-ignored
  - No staging/demo GitHub Environments or deploy.yml required
  owner: BAG
  estimate_h: 4
  priority: P0
  status: done
  sprint: S1
  issue: 1
  prompt: prompts/P00_bootstrap.md
