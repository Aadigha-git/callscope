  title: "Spike S-5: ASR/TTS shortlist probe on clean and 8 kHz audio"
  milestone: M0
  type: spike
  requirements: [FR-05, FR-07]
  description: >-
    Compare 2 ASR and 2 TTS candidates on streaming support, licence, VRAM and WER on a 30-utterance
