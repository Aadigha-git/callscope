# Source of truth for tasks, sprints and status. Edit via `make status` / `make sprint` where possible.
# Fields: id, title, milestone, type, requirements, description, technical_approach, dependencies,
#         acceptance_criteria, owner, estimate_h, priority, status, sprint, issue, prompt
# status: backlog | ready | in_progress | in_review | done | blocked
tasks:
# ===================== M0 Setup and spikes =====================
- id: T-M0-01
  title: Engineering environment and repository bootstrap
  milestone: M0
  type: chore
  requirements: [NFR-05, NFR-12]
  description: >-
    Create the GitHub repo from the bootstrap kit: branch protection, CI, secrets handling,
    labels/milestones/issues, Project board, logging + metrics baseline.
  technical_approach: >-
    Follow docs/DEV_GUIDE.md section 4.1 step by step; run scripts/setup_github.sh; verify a
    green CI run on a trivial PR.
  dependencies: []
  acceptance_criteria:
    - "main is protected; PRs require green CI (lint, typecheck, test, security, artifacts-gate)"
    - "make setup && make ci passes on a clean clone"
    - "All backlog tasks exist as GitHub issues linked to milestones M0-M6"
    - "Secret scanning + push protection enabled; .env is git-ignored"
  owner: BAG
  estimate_h: 4
  priority: P0
  status: in_review
  sprint: S1
  issue: 1
  prompt: prompts/P00_bootstrap.md
- id: T-M0-02
  title: "Spike S-1: can a call/turn ID reach Hermes hooks via the API server?"
  milestone: M0
  type: spike
  requirements: [FR-02, NFR-08]
  description: >-
    Determine whether request metadata (user field, headers, message content) is visible in plugin
    hook kwargs when Hermes is called through its OpenAI-compatible API server.
  technical_approach: >-
    Install Hermes in a scratch venv, write a 30-line plugin that logs kwargs of every hook, call
    /v1/chat/completions with user and X-Call-Id, record what arrives.
  dependencies: [T-M0-01]
  acceptance_criteria:
    - "Written finding in docs/DECISIONS.md: yes/no and exact mechanism, with Hermes version"
    - "ADR-006 fallback (CALL_CONTEXT + call_id tool arg) confirmed or replaced"
    - "Throwaway spike code kept under spikes/ (not in callscope/)"
  owner: BAG
  estimate_h: 4
  priority: P0
  status: in_review
  sprint: S1
  issue: 2
  prompt: prompts/M0_spikes.md#t-m0-02
- id: T-M0-03
  title: "Spike S-2: Hermes per-turn overhead with a slim profile"
  milestone: M0
  type: spike
  requirements: [NFR-01]
  description: >-
    Measure time-to-first-token through Hermes vs the same LLM called directly, with a minimal
    receptionist profile (no memory, locked toolset).
  technical_approach: >-
    Script 50 turns against both paths (vLLM direct, Hermes API server), record p50/p95 TTFT and
    system-prompt token count; try prompt caching on/off.
  dependencies: [T-M0-01, T-M0-04]
  acceptance_criteria:
    - "Table of p50/p95 TTFT: direct vs Hermes, in DECISIONS.md"
    - "Verdict against the 450 ms brain budget; mitigation chosen if it fails"
  owner: BAG
  estimate_h: 5
  priority: P0
  status: backlog
  sprint: null
  issue: 3
  prompt: prompts/M0_spikes.md#t-m0-03
- id: T-M0-04
  title: "Spike S-3: LLM shortlist tool-call reliability via vLLM + Hermes"
  milestone: M0
  type: spike
  requirements: [FR-02, FR-05]
  description: >-
    Serve 2-3 open-weight instruct models with vLLM and measure valid tool-call rate through Hermes
    on 60 scripted receptionist turns.
  technical_approach: >-
    Launch vLLM with the right tool-call parser per model, run the scripted turns through a
    throwaway harness, count valid calls / schema-correct args / recoveries.
  dependencies: [T-M0-01, T-M0-07]
