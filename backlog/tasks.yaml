    \ plugin hook kwargs when Hermes is called through its OpenAI-compatible API server."
  technical_approach: "Install Hermes in a scratch venv, write a 30-line plugin that logs kwargs of every\
    \ hook, call /v1/chat/completions with user and X-Call-Id, record what arrives."
