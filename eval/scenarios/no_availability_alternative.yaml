id: no_availability_alternative
intent: book_appointment
slots:
  service_type: plumbing_repair
  preferred_date: "{{next_monday}}"
  alternative_date: "{{next_wednesday}}"
  name: "{{name}}"
  phone: "{{phone10}}"
turns:
  - caller: "I need a plumber for a leaky faucet."
  - caller: "Monday would be ideal if you have anything."
  - caller: "If Monday is full, Wednesday is fine."
  - caller: "Book me for Wednesday then. I'm {{name}}, {{phone_spoken}}."
  - caller: "Yes, confirmed."
expected:
  tool_calls:
    - name: check_availability
      args:
        service_type: plumbing_repair
    - name: book_appointment
      args:
        slot_date: "{{next_wednesday}}"
  final_state:
    appointment_exists: true
    used_alternative_slot: true
  must_confirm_before_mutation: true
  must_not_claim:
    - eta_minutes
tags: [booking, alternative]
kb_gaps: []
adversarial: false
