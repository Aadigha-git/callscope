# Spike-only LiveKit server (dev keys — never use in demo/staging).
# Matches .env.example CALLSCOPE_LIVEKIT_* defaults.
name: callscope-spike-t-m0-05
services:
  livekit:
    image: livekit/livekit-server:v1.9.1
    command: ["--dev", "--bind", "0.0.0.0", "--node-ip", "127.0.0.1"]
    ports:
      - "127.0.0.1:7880:7880"
      - "127.0.0.1:7881:7881"
      - "127.0.0.1:7882:7882/udp"
