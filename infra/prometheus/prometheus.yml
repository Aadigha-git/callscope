global:
  scrape_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: callscope-api
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]

  - job_name: callscope-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:9100"]

  - job_name: callscope-asr
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8200"]

  - job_name: callscope-tts
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8300"]

  - job_name: callscope-eval
    metrics_path: /metrics/eval
    static_configs:
      - targets: ["host.docker.internal:8000"]
