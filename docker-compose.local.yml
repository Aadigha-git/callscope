# Local data/observability plane only. ASR/TTS/Hermes/worker/livekit-server run natively
# (Docker Desktop on Mac cannot use Metal/GPU). Ports bound to localhost only.
name: callscope-local
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: callscope
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-callscope_dev}
      POSTGRES_DB: callscope
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U callscope"]
      interval: 5s
      timeout: 3s
      retries: 10
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-callscope}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-callscope_dev_secret}
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: [miniodata:/data]
  prometheus:
    image: prom/prometheus:latest
    volumes: ["./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["127.0.0.1:9090:9090"]
    extra_hosts: ["host.docker.internal:host-gateway"]
  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin_local_only}
    ports: ["127.0.0.1:3000:3000"]
    volumes: [grafanadata:/var/lib/grafana]
volumes:
  pgdata: {}
  miniodata: {}
  grafanadata: {}
