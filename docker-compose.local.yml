# Local data/observability plane only. ASR/TTS/Hermes/worker/livekit-server run natively
# (Docker Desktop on Mac cannot use Metal/GPU). Ports bound to localhost only.
name: callscope-local
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: callscope
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-callscope_dev}
      POSTGRES_DB: callscope
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U callscope"]
      interval: 5s
      timeout: 3s
      retries: 10
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-callscope}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-callscope_dev_secret}
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: [miniodata:/data]
  # MLflow tracking (T-M5-01). Default local file store also works without this service.
  # Artifacts land in MinIO when MLFLOW_S3_ENDPOINT_URL is set.
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.17.2
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:///mlflow/mlflow.db
      --default-artifact-root s3://callscope/mlflow
      --serve-artifacts
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-callscope}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-callscope_dev_secret}
      AWS_DEFAULT_REGION: us-east-1
    ports: ["127.0.0.1:5000:5000"]
    volumes: [mlflowdata:/mlflow]
    depends_on: [minio]
  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - "./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"
      - "./infra/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro"
    ports: ["127.0.0.1:9090:9090"]
    extra_hosts: ["host.docker.internal:host-gateway"]
  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin_local_only}
      GF_USERS_DEFAULT_THEME: light
    ports: ["127.0.0.1:3000:3000"]
    volumes:
      - grafanadata:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]
volumes:
  pgdata: {}
  miniodata: {}
  grafanadata: {}
  mlflowdata: {}
